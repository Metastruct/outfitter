name: Create Amalgamation

on:
  push:
    branches:
      - dev

jobs:
  lint:
    uses: FPtje/GLuaFixer/.github/workflows/glualint.yml@master
    with:
      config: "./.glualint.json"

  create-amalgamation:
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies and build
        run: npm install

      - name: Deploy dist to amalgamation branch
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git fetch origin amalgamation
          git checkout amalgamation
          git rm -r --cached . 2>/dev/null || true
          rm -rf * 2>/dev/null || true
          find . -maxdepth 1 -name '.*' -not -name '.git' -not -name '.' -not -name '..' -exec rm -rf {} + 2>/dev/null || true

          cp -r "${{ github.workspace }}/dist/"* .

          git add -A
          git commit -m "Amalgamation build from ${{ github.sha }}"
          git push origin amalgamation
